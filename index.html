<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farol · Demos</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
<style>
  :root { --bg: #12151d; --fg: #f3eee6; --muted: #9aa0ad; --gold: #ffc857; --card: #1b2030; --line: #2a3042; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Outfit, system-ui, sans-serif; line-height: 1.6;
         padding: max(40px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 60px max(20px, env(safe-area-inset-left)); }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: .12em; margin: 0 0 .3rem; }
  h1 span { color: var(--gold); }
  p.lead { color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  a.card { display: grid; gap: .2rem; padding: 1.3rem 1.4rem; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; transition: border-color .3s, transform .3s; }
  a.card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .name { font-weight: 700; font-size: 1.25rem; }
  .meta { color: var(--muted); font-size: .92rem; }
  .tag { color: var(--gold); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <h1>FAR<span>O</span>L</h1>
  <p class="lead">Webs de demostración para bares y restaurantes de Madrid.</p>
  <ul>
    <li><a class="card" href="tomoshibi/"><span class="tag">Sushi · Omakase</span><span class="name">Tomoshibi</span><span class="meta">Minimalista y premium · intro animada · reservas con asientos en la barra</span></a></li>
    <li><a class="card" href="https://casa-lolaes.lovable.app/" target="_blank" rel="noopener"><span class="tag">Tapas · Bar</span><span class="name">Casa Lola</span><span class="meta">Cálido y castizo · menú del día · carta con "Mi mesa" y filtro de alérgenos</span></a></li>
  </ul>
</main>
</body>
</html>
