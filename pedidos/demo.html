<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Farol · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=202610301029">
<style>
  /* Demo stage: a graphite bar on top, customer phone and restaurant hub side by side. */
  :root { --stage: #0B0C0E; --stage-2: #15171A; --stage-line: #272B31; --stage-text: #ECEDEF; --stage-text-2: #A4A9B2; --stage-lamp: #FFB547; }
  html, body { height: 100%; }
  body { background: var(--stage); color: var(--stage-text); font-family: 'Instrument Sans', system-ui, sans-serif; }
  .demo { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--stage); }
  .demo-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--stage-line); }
  .demo-bar strong { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 650; }
  .demo-bar strong svg { display: block; }
  .demo-bar p { margin: 0; flex: 1; min-width: 220px; font-size: 13px; color: var(--stage-text-2); }
  .demo-bar label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--stage-text-2); }
  .demo-bar select, .demo-bar button { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--stage-line); background: var(--stage-2); color: var(--stage-text); font: inherit; font-weight: 500; }
  .demo-bar button:hover { border-color: var(--stage-text-2); }
  .demo-split { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 20px; min-height: 0;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
  .demo-side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .demo-label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500; color: var(--stage-text-2); }
  .demo-phone { flex: 1; min-height: 0; max-height: 820px; overflow: hidden; border: 9px solid #22262B; border-radius: 40px; background: #F6F1E7; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .demo-hub { flex: 1; min-height: 0; overflow: hidden; border: 1px solid var(--stage-line); border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .demo-tabs { display: none; }
  @media (max-width: 900px) {
    .demo-split { grid-template-columns: minmax(0, 1fr); padding-top: 12px; padding-bottom: 12px; }
    .demo-tabs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--stage-line); border-radius: 10px; background: var(--stage-2); }
    .demo-tabs button { flex: 1; height: 34px; border: 0; border-radius: 7px; background: none; color: var(--stage-text-2); font: inherit; font-weight: 500; }
    .demo-tabs button.is-on { background: #23272C; color: var(--stage-text); }
    .demo-side { display: none; }
    .demo-side.is-on { display: flex; }
    .demo-phone { border-width: 0; border-radius: 14px; }
  }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="demo">
  <div class="demo-bar">
    <strong><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6" fill="#262A30"/><circle cx="12" cy="12" r="3.6" fill="#FFB547"/><path d="M12 3.6v2.4M12 18v2.4M3.6 12H6M18 12h2.4" stroke="#FFB547" stroke-width="1.6" stroke-linecap="round" opacity=".55"/></svg>Farol</strong>
    <p>Pide desde el móvil a la izquierda y mira cómo llega al hub del restaurante. · Order on the phone and watch it arrive in the restaurant hub.</p>
    <label>Mesa · Table <select id="table" aria-label="Mesa"></select></label>
    <button id="reset" type="button">Reiniciar demo · Reset</button>
  </div>
  <div class="demo-split">
    <div class="demo-tabs" role="tablist">
      <button class="is-on" data-tab="cust" role="tab">Cliente · Customer</button>
      <button data-tab="rest" role="tab">Restaurante · Restaurant</button>
    </div>
    <section class="demo-side is-on" id="side-cust" aria-label="Cliente">
      <div class="demo-label"><span>Cliente · Customer</span><span id="table-label"></span></div>
      <div class="demo-phone"><div id="customer" style="height:100%"></div></div>
    </section>
    <section class="demo-side" id="side-rest" aria-label="Restaurante" style="display:flex">
      <div class="demo-label"><span>Restaurante · Restaurant hub</span></div>
      <div class="demo-hub"><div id="hub" style="height:100%"></div></div>
    </section>
  </div>
</div>
<script type="module">
  import { render } from './assets/js/vendor/preact-htm.js?v=202610301029';
  import { createDemoApi } from './assets/js/api/demo-api.js?v=202610301029';
  import { mountOrderApp } from './assets/js/order/app.js?v=202610301029';
  import { mountHubApp } from './assets/js/hub/app.js?v=202610301029';

  const api = createDemoApi();
  const sel = document.getElementById('table');
  const custEl = document.getElementById('customer');

  async function tables() {
    const list = await api.myRestaurants();
    return list[0] ? api.listTables(list[0].id) : [];
  }
  async function fillTables(keep) {
    const list = (await tables()).filter((t) => t.active);
    sel.innerHTML = list.map((t) => `<option value="${t.token}">${t.label}</option>`).join('');
    const pick = list.find((t) => t.token === keep) || list.find((t) => t.label === 'Mesa 3') || list[0];
    if (pick) sel.value = pick.token;
    showCustomer();
  }
  function showCustomer() {
    render(null, custEl);
    if (sel.value) mountOrderApp(custEl, { api, tableToken: sel.value, key: sel.value });
  }
  sel.addEventListener('change', showCustomer);
  // two taps to reset (pop-up dialogs are blocked in some embedded views)
  const resetBtn = document.getElementById('reset');
  let armed = null;
  resetBtn.addEventListener('click', () => {
    if (!armed) {
      resetBtn.textContent = '¿Seguro? Pulsa otra vez · Tap again';
      armed = setTimeout(() => { armed = null; resetBtn.textContent = 'Reiniciar demo · Reset'; }, 4000);
      return;
    }
    clearTimeout(armed);
    try { Object.keys(localStorage).filter((k) => k.startsWith('farol-')).forEach((k) => localStorage.removeItem(k)); } catch {}
    api.resetDemo();
    location.reload();
  });

  // narrow screens: tabs between the two views
  const sides = { cust: document.getElementById('side-cust'), rest: document.getElementById('side-rest') };
  document.querySelectorAll('.demo-tabs button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.demo-tabs button').forEach((x) => x.classList.toggle('is-on', x === b));
    Object.entries(sides).forEach(([k, el]) => el.classList.toggle('is-on', k === b.dataset.tab));
  }));
  const mq = matchMedia('(max-width: 900px)');
  const sync = () => { sides.rest.style.display = mq.matches ? '' : 'flex'; };
  mq.addEventListener('change', sync); sync();

  // "Try it" on a table's QR card switches the phone on the left to that table
  mountHubApp(document.getElementById('hub'), { api, onTryTable: (token) => {
    sel.value = token; showCustomer();
    if (mq.matches) document.querySelector('.demo-tabs button[data-tab="cust"]').click();
  } });
  fillTables();
</script>
</body>
</html>
