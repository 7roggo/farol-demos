<style>
  .home { min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px; }

  .home a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; background: var(--paper);

  .home a small { font-weight: 500; color: var(--ink-3); }
  .home a:hover { border-color: var(--ink); }
